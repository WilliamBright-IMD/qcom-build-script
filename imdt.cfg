# AR1335
CONFIG_VIDEO_AR1335=m
# Wi-Fi
CONFIG_MWIFIEX=m
CONFIG_MWIFIEX_SDIO=m
# Ethernet (LAN7430 on PCIe). CONFIG_LAN743X lives under the
# NET_VENDOR_MICROCHIP menu, which arm64 defconfig explicitly disables
# ("# CONFIG_NET_VENDOR_MICROCHIP is not set"). Without re-enabling the parent
# here, Kconfig silently drops CONFIG_LAN743X and the kernel ends up with no
# ethernet driver at all - which strands the board when adb is the only other
# channel.
CONFIG_NET_VENDOR_MICROCHIP=y
CONFIG_LAN743X=m
# Speed up ADB / RNDIS gadget bring-up: build the USB device-mode stack
# directly into the kernel so the UDC is available at rootfs mount time,
# not after module autoload.
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ECM=y
# Panel and backlight
CONFIG_BACKLIGHT_GPIO=m
CONFIG_DRM_PANEL_SIMPLE=m
# M.2 Key-E connector power sequencing: the pcie-m2-e-connector driver
# enables the card's 3V3/1V8 supplies and deasserts W_DISABLE1# so the
# PCIe slot powers up and enumerates. Consumer side (PCI_PWRCTRL_PWRSEQ)
# is already =m via defconfig.
CONFIG_POWER_SEQUENCING_PCIE_M2=y
# Contiguous Memory Allocator for DMA. Required by the fastrpc ADSP/CDSP
# remote-heap carveout (adsp-rpc-remote-heap, a "reusable" shared-dma-pool in
# the device tree): without DMA_CMA a reusable region gets no handler, the
# fastrpc device's of_reserved_mem_device_init fails, and fastrpc probe aborts
# (-EINVAL) so the DSP static PDs never come up. CONFIG_CMA is already =y.
CONFIG_DMA_CMA=y

CONFIG_QCOM_CDSPRM=y

# SDHC4 debugging
CONFIG_DYNAMIC_DEBUG=y
